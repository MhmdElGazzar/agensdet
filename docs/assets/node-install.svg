<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" width="780" height="650" role="img" aria-label="Installing Node: first option that works">
<title>Installing Node: first option that works (ADR-0004)</title>
<!-- Hand-drawn in the style of scripts/registry.mjs; source: ADR-0004. Update both together. -->
<style>
  :root, svg { --bg:#ffffff; --band:#f2f4f7; --fg:#1f2328; --muted:#59636e; --line:#c9d1d9; --accent:#0e7c86; --warn:#9a6700; --gap:#c62828; --ok:#1f7a4d; --ok-bg:#e4f4ec; }
  @media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --band:#161b22; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --accent:#4cc3cc; --warn:#d29922; --gap:#f08a82; --ok:#5cc994; --ok-bg:#173126; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
  .start .box { fill: var(--fg); stroke: none; } .start .t { fill: var(--bg); }
  .q .box { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
  .a .box { stroke: var(--accent); stroke-width: 2; }
  .stop .box { stroke: var(--warn); stroke-width: 2; }
  .done .box { fill: var(--ok-bg); stroke: var(--ok); stroke-width: 2; } .done .t { fill: var(--ok); }
  .t { fill: var(--fg); font-size: 14px; font-weight: 600; }
  .s { fill: var(--muted); font-size: 12px; }
  .lbl { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .edge { fill: none; stroke: var(--muted); stroke-width: 1.6; } .ah { fill: var(--muted); }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="780" height="650" rx="14"/>
<g class="start"><rect class="box" x="120" y="20" width="240" height="44" rx="10"/><text class="t" x="240.0" y="47.0" text-anchor="middle">Node is needed</text></g>
<g class="q"><rect class="box" x="60" y="110" width="360" height="64" rx="10"/><text class="t" x="240.0" y="139.0" text-anchor="middle">Node of the LTS major</text><text class="s" x="240.0" y="157.0" text-anchor="middle">already on the machine?</text></g>
<g class="q"><rect class="box" x="60" y="210" width="360" height="64" rx="10"/><text class="t" x="240.0" y="239.0" text-anchor="middle">Windows, or a Mac</text><text class="s" x="240.0" y="257.0" text-anchor="middle">with Homebrew?</text></g>
<g class="a"><rect class="box" x="60" y="320" width="360" height="72" rx="10"/><text class="t" x="240.0" y="353.0" text-anchor="middle">Install fnm per user, then Node LTS</text><text class="s" x="240.0" y="371.0" text-anchor="middle">No admin rights · default Node unchanged</text></g>
<g class="a"><rect class="box" x="60" y="430" width="360" height="72" rx="10"/><text class="t" x="240.0" y="463.0" text-anchor="middle">nodejs.org installer</text><text class="s" x="240.0" y="481.0" text-anchor="middle">The tester types the admin password</text></g>
<g class="stop"><rect class="box" x="60" y="540" width="360" height="72" rx="10"/><text class="t" x="240.0" y="573.0" text-anchor="middle">Stop: the tester installs Node</text><text class="s" x="240.0" y="591.0" text-anchor="middle">following Claude's steps for their OS</text></g>
<g class="done"><rect class="box" x="540" y="118.0" width="200" height="48" rx="10"/><text class="t" x="640.0" y="147.0" text-anchor="middle">Use it, install nothing</text></g>
<g class="done"><rect class="box" x="540" y="332.0" width="200" height="48" rx="10"/><text class="t" x="640.0" y="361.0" text-anchor="middle">Node ready</text></g>
<g class="done"><rect class="box" x="540" y="442.0" width="200" height="48" rx="10"/><text class="t" x="640.0" y="471.0" text-anchor="middle">Node ready</text></g>
<g class="done"><rect class="box" x="540" y="552.0" width="200" height="48" rx="10"/><text class="t" x="640.0" y="581.0" text-anchor="middle">Check again</text></g>
<path class="edge" d="M240.0,64 L240.0,110" marker-end="url(#ah)"/>
<path class="edge" d="M240.0,174 L240.0,210" marker-end="url(#ah)"/><text class="lbl" x="250.0" y="198" text-anchor="start">no</text>
<path class="edge" d="M240.0,274 L240.0,320" marker-end="url(#ah)"/><text class="lbl" x="250.0" y="304" text-anchor="start">yes</text>
<path class="edge" d="M240.0,392 L240.0,430" marker-end="url(#ah)"/><text class="lbl" x="250.0" y="416" text-anchor="start">failed or blocked</text>
<path class="edge" d="M240.0,502 L240.0,540" marker-end="url(#ah)"/><text class="lbl" x="250.0" y="526" text-anchor="start">failed or blocked</text>
<path class="edge" d="M60,242.0 L26,242.0 L26,466.0 L60,466.0" marker-end="url(#ah)"/><text class="lbl" x="20" y="234.0" text-anchor="end">no</text>
<path class="edge" d="M420,142.0 L540,142.0" marker-end="url(#ah)"/><text class="lbl" x="480.0" y="134.0" text-anchor="middle">yes</text>
<path class="edge" d="M420,356.0 L540,356.0" marker-end="url(#ah)"/><text class="lbl" x="480.0" y="348.0" text-anchor="middle">worked</text>
<path class="edge" d="M420,466.0 L540,466.0" marker-end="url(#ah)"/><text class="lbl" x="480.0" y="458.0" text-anchor="middle">worked</text>
<path class="edge" d="M420,576.0 L540,576.0" marker-end="url(#ah)"/>
<text class="s" x="60" y="636">Dashed: Claude checks the machine. Solid: an action. Green: next is the version check (step 7).</text>
