schema_version: "1.1"
name: f-005-03-already-a-project
description: "With a playwright.config.ts already there, says so and asks: use it or pick another folder."
tags: [F-005, setup]
runs: 3
execution:
  prompt: "/init-project"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_PSDET_MACHINE: "macos-15-homebrew-node-lts+lang-en"
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-npm-init
    type: tool_used
    tool: 'Bash'
    input_match: 'npm init'
    min: 0
    max: 0
  - name: asks
    type: llm
    criteria: 'The reply says the folder is already a Playwright project and asks whether to use it (and run the sample test) or choose another folder.'
