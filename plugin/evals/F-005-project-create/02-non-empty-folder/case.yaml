schema_version: "1.1"
name: f-005-02-non-empty-folder
description: "With other files in the open folder, suggests a new playwright-tests folder inside it and writes nothing."
tags: [F-005, setup]
runs: 3
execution:
  prompt: "/init-project"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_PSDET_MACHINE: "macos-15-homebrew-node-lts+lang-en"
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
  - name: suggests-subfolder
    type: regex
    pattern: 'playwright-tests'
