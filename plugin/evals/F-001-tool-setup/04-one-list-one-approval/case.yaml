schema_version: "1.1"
name: f-001-04-one-list-one-approval
description: "Shows one list (tool, purpose, where it lives, state, what changes) and asks once; installs nothing yet."
tags: [F-001, setup]
runs: 3
execution:
  prompt: "/init-project"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_PSDET_MACHINE: "macos-15-homebrew-no-node+lang-en"
graders:
  - name: no-install
    type: tool_used
    tool: 'Bash'
    input_match: 'install-node\.sh|brew install|winget install|fnm install|\.pkg|\.msi|npm init'
    min: 0
    max: 0
  - name: mentions-fnm
    type: regex
    pattern: 'fnm'
  - name: mentions-profile-line
    type: regex
    pattern: 'zshrc'
  - name: asks-once
    type: llm
    criteria: 'The reply asks the tester for approval to install the listed tools.'
