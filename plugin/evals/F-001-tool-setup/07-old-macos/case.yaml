schema_version: "1.1"
name: f-001-07-old-macos
description: "Stops on macOS older than 13 and says the minimum."
tags: [F-001, setup]
runs: 3
execution:
  prompt: "/init-project"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_PSDET_MACHINE: "macos-12-homebrew-no-node+lang-en"
graders:
  - name: no-install
    type: tool_used
    tool: 'Bash'
    input_match: 'install-node\.sh|brew install|winget install|fnm install|\.pkg|\.msi|npm init'
    min: 0
    max: 0
  - name: minimum
    type: regex
    pattern: 'macOS 13'
    flags: 'i'
