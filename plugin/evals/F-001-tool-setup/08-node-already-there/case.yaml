schema_version: "1.1"
name: f-001-08-node-already-there
description: "With a Node of the LTS major already the default, installs nothing and shows the summary."
tags: [F-001, setup]
runs: 3
execution:
  prompt: "/init-project"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_PSDET_MACHINE: "macos-15-homebrew-node-lts+lang-en"
graders:
  - name: no-install
    type: tool_used
    tool: 'Bash'
    input_match: 'install-node\.sh|brew install|winget install|fnm install|\.pkg|\.msi|npm init'
    min: 0
    max: 0
  - name: shows-version
    type: regex
    pattern: 'v24\.'
  - name: nothing-to-install
    type: llm
    criteria: 'The reply says nothing needs to be installed because Node is already there, and then moves on to the project (for example by suggesting a folder).'
