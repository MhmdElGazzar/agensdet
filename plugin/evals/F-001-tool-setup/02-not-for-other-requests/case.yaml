schema_version: "1.1"
name: f-001-02-not-for-other-requests
description: "Doesn't start for a request about an existing project."
tags: [F-001, setup]
runs: 3
execution:
  prompt: "In my existing Playwright project, add a test that checks the login page title."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_PSDET_MACHINE: "macos-15-homebrew-node-lts"
graders:
  - name: skill-not-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?init-project"'
    min: 0
    max: 0
