schema_version: "1.1"
name: f-001-01-fires-on-request
description: "Starts when the tester asks to start automation in their own words."
tags: [F-001, setup]
runs: 3
execution:
  prompt: "I'm a manual tester and I want to start test automation with Playwright. Where do I begin?"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_PSDET_MACHINE: "macos-15-homebrew-no-node"
graders:
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?init-project"'
    min: 1
