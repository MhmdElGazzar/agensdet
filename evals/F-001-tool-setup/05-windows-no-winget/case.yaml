schema_version: "1.1"
name: f-001-05-windows-no-winget
description: "Without winget, the list offers the nodejs.org installer and says it needs an admin password."
tags: [F-001, setup]
runs: 3
execution:
  prompt: "/init-project"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_PSDET_MACHINE: "windows-11-no-winget-no-node+lang-en"
graders:
  - name: no-install
    type: tool_used
    tool: 'Bash'
    input_match: 'brew install|winget install|fnm install|\.pkg|\.msi|npm init'
    max: 0
  - name: installer-route
    type: llm
    criteria: 'The reply proposes installing Node with the nodejs.org installer (.msi) and says the tester will need an administrator password. It does not propose fnm or winget.'
